[project]
name = "garmin-to-wanderer"
dynamic = ["version"]
description = "Synchronise Garmin Connect activities to Wanderer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Mikel Larreategi", email = "mlarreategi@codesyntax.com" },
]
keywords = ["garmin", "wanderer", "activities", "fit", "gpx", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Utilities",
]
dependencies = [
    "garminconnect>=0.3.11,<0.4",
    "PyYAML>=6.0",
    "requests>=2.31",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "requests-mock>=1.12",
    "ruff>=0.6",
    "twine>=5.0",
]

[project.scripts]
garmin-to-wanderer = "garmin_to_wanderer.cli:app"

[project.urls]
Homepage = "https://github.com/erral/garmin-to-wanderer"
Repository = "https://github.com/erral/garmin-to-wanderer"
Issues = "https://github.com/erral/garmin-to-wanderer/issues"
Releases = "https://github.com/erral/garmin-to-wanderer/releases"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["garmin_to_wanderer*"]

[tool.setuptools.dynamic]
version = { attr = "garmin_to_wanderer.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.format]
quote-style = "double"
