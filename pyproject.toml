[project]
name = "garmin-to-wanderer"
version = "0.1.0"
description = "Synchronise Garmin Connect activities to Wanderer"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.11,<0.4",
    "PyYAML>=6.0",
    "requests>=2.31",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "requests-mock>=1.12",
    "ruff>=0.6",
]

[project.scripts]
garmin-to-wanderer = "garmin_to_wanderer.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["garmin_to_wanderer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.format]
quote-style = "double"
